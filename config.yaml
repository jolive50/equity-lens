# FreshStart Model Configuration
#
# This file controls which ML models are used for predictions and sentiment analysis.
# You can switch between single-model and ensemble modes for experimentation.

# Prediction Models Configuration
prediction:
  # Mode: "single" (use one model) or "ensemble" (combine multiple models)
  mode: "single"

  # Models to use: Choose from ["lstm", "gru", "gradient_boost"]
  # For MVP, only LSTM is implemented
  models:
    - "lstm"

  # Ensemble strategy (only used if mode: "ensemble")
  # Options: "weighted_average", "voting", "stacking"
  strategy: "weighted_average"

  # Model weights (must sum to 1.0 for weighted_average)
  weights:
    lstm: 1.0
    # gru: 0.3
    # gradient_boost: 0.2

# Sentiment Models Configuration
sentiment:
  # Mode: "single" (use one model) or "ensemble" (combine multiple models)
  mode: "single"

  # Models to use: Choose from ["finbert", "roberta", "vader", "distilbert", "textblob"]
  # For MVP, only FinBERT is implemented
  models:
    - "finbert"

  # Ensemble strategy (only used if mode: "ensemble")
  strategy: "weighted_average"

  # Model weights (must sum to 1.0 for weighted_average)
  weights:
    finbert: 1.0
    # roberta: 0.3
    # vader: 0.2

